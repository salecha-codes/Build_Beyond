name: Publish Android APK to latest release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    if: github.repository == 'salecha-codes/Build_Beyond'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web build dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build universal Android APK
        run: ../gradlew :app:assembleDebug
        working-directory: android

      - name: Replace APK on the latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [ -z "$tag" ]; then
            echo "::error::No published GitHub Release was found."
            exit 1
          fi
          cp android/app/build/outputs/apk/debug/app-universal-debug.apk /tmp/AgriScan2.1.apk
          gh release upload "$tag" /tmp/AgriScan2.1.apk --repo "$GITHUB_REPOSITORY" --clobber
