name: Publish Android preview APK

on:
  push:
    tags:
      - 'v*-preview.*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build universal debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee android-build.log

      - name: Surface Gradle failure summary
        if: failure()
        shell: bash
        run: |
          if [[ -f android-build.log ]]; then
            grep -E 'What went wrong|Could not|Execution failed|FAILURE:|e: |Exception|Error:' android-build.log | tail -n 25 | sed 's/^/::error::/' || true
          fi

      - name: Prepare release asset
        run: cp android/app/build/outputs/apk/debug/app-universal-debug.apk crop-health-universal-debug.apk

      - name: Publish APK on GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          name: AgriScan ${{ github.ref_name }}
          prerelease: true
          body: |
            AgriScan hackathon preview build for evaluation and testing. This universal APK is debug-signed and is not a Google Play production release.

            Install on Android 7.0 (API 24) or newer. Android may ask you to allow installation from the app used to download this file.
          files: crop-health-universal-debug.apk
